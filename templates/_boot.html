<script>(function(){var r=document.documentElement,t=null,a=null;try{t=localStorage.getItem('fwz-theme');a=localStorage.getItem('fwz-accent')}catch(e){}
if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
r.setAttribute('data-theme',t);r.setAttribute('data-accent',a||'green')})();</script>

<script>
window.googleTranslateElementInit = function() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'bn,en',
    autoDisplay: false
  }, 'google_translate_element');
};
(function() {
  var d = document.createElement('div');
  d.id = 'google_translate_element';
  d.style.display = 'none';
  if (document.body) { document.body.appendChild(d); }
  else { document.addEventListener('DOMContentLoaded', function() { document.body.appendChild(d); }); }
  var s = document.createElement('script');
  s.type = 'text/javascript';
  s.async = true;
  s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
  document.head.appendChild(s);
})();
</script>
