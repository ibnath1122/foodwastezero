<script>(function(){var r=document.documentElement,t=null,a=null;try{t=localStorage.getItem('fwz-theme');a=localStorage.getItem('fwz-accent')}catch(e){}

r.setAttribute('data-theme',t);r.setAttribute('data-accent',a||'green')})();</script>
